# Cloud Build pipeline — builds and deploys both backend and frontend to Cloud Run
steps:
  # ─── Backend ──────────────────────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-backend'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/shiftsync-backend:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/shiftsync-backend:latest'
      - './backend'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-backend'
    waitFor: ['build-backend']
    args: ['push', '--all-tags', 'gcr.io/$PROJECT_ID/shiftsync-backend']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-backend'
    waitFor: ['push-backend']
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'shiftsync-backend'
      - '--image=gcr.io/$PROJECT_ID/shiftsync-backend:$COMMIT_SHA'
      - '--region=asia-southeast1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--concurrency=80'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--set-env-vars=GOOGLE_CLOUD_PROJECT=$PROJECT_ID'
      - '--set-secrets=GEMINI_API_KEY=shiftsync-gemini-key:latest'

  # ─── Frontend ─────────────────────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-frontend'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/shiftsync-frontend:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/shiftsync-frontend:latest'
      - './frontend'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-frontend'
    waitFor: ['build-frontend']
    args: ['push', '--all-tags', 'gcr.io/$PROJECT_ID/shiftsync-frontend']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-frontend'
    waitFor: ['push-frontend', 'deploy-backend']
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'shiftsync-frontend'
      - '--image=gcr.io/$PROJECT_ID/shiftsync-frontend:$COMMIT_SHA'
      - '--region=asia-southeast1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=256Mi'
      - '--cpu=1'
      - '--concurrency=200'
      - '--min-instances=0'
      - '--max-instances=5'

images:
  - 'gcr.io/$PROJECT_ID/shiftsync-backend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/shiftsync-frontend:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
