# Cloud Build pipeline — builds and deploys backend + frontend to Cloud Run
# Trigger: push to master branch
steps:
  # ── 1. Build backend image ──────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-backend'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/shiftsync-backend:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/shiftsync-backend:latest'
      - './backend'

  # ── 2. Push backend image ───────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-backend'
    waitFor: ['build-backend']
    args: ['push', '--all-tags', 'gcr.io/$PROJECT_ID/shiftsync-backend']

  # ── 3. Deploy backend to Cloud Run ─────────────────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-backend'
    waitFor: ['push-backend']
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'shiftsync-backend'
      - '--image=gcr.io/$PROJECT_ID/shiftsync-backend:$COMMIT_SHA'
      - '--region=asia-southeast1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--concurrency=80'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--set-env-vars=GOOGLE_CLOUD_PROJECT=$PROJECT_ID'
      - '--set-secrets=GEMINI_API_KEY=shiftsync-gemini-key:latest'
      - '--set-env-vars=SECRET_KEY=$$JWT_SECRET_KEY'
    secretEnv: ['JWT_SECRET_KEY']

  # ── 4. Get backend URL ──────────────────────────────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'get-backend-url'
    waitFor: ['deploy-backend']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud run services describe shiftsync-backend \
          --region=asia-southeast1 \
          --format='value(status.url)' > /workspace/backend_url.txt
        echo "Backend URL: $(cat /workspace/backend_url.txt)"

  # ── 5. Build frontend image ─────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-frontend'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/shiftsync-frontend:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/shiftsync-frontend:latest'
      - './frontend'

  # ── 6. Push frontend image ──────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-frontend'
    waitFor: ['build-frontend']
    args: ['push', '--all-tags', 'gcr.io/$PROJECT_ID/shiftsync-frontend']

  # ── 7. Deploy frontend to Cloud Run (inject BACKEND_URL at runtime) ─────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-frontend'
    waitFor: ['push-frontend', 'get-backend-url']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        BACKEND_URL=$(cat /workspace/backend_url.txt)
        gcloud run deploy shiftsync-frontend \
          --image=gcr.io/$PROJECT_ID/shiftsync-frontend:$COMMIT_SHA \
          --region=asia-southeast1 \
          --platform=managed \
          --allow-unauthenticated \
          --memory=256Mi \
          --cpu=1 \
          --concurrency=200 \
          --min-instances=0 \
          --max-instances=5 \
          --set-env-vars=BACKEND_URL=$BACKEND_URL

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/shiftsync-jwt-secret/versions/latest
      env: 'JWT_SECRET_KEY'

images:
  - 'gcr.io/$PROJECT_ID/shiftsync-backend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/shiftsync-frontend:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
